<Directory "/var/www/html">
    Options FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php index.html
</Directory>

# Read by .htaccess: no HTTPS redirect in the container, unless
# SITEIMAGEPERSO_FORCE_HTTPS=1 (which then defines SITEIMAGEPERSO_FORCE_HTTPS_1)
Define SITEIMAGEPERSO_DOCKER
Define SITEIMAGEPERSO_FORCE_HTTPS_${SITEIMAGEPERSO_FORCE_HTTPS}

# Memory: each Apache process with PHP uses about 10 to 20 MB.
# By default Apache can start 150; about ten is plenty
# for a family site. Beware: every open connection, including
# a video being played, holds a process for its whole duration.
<IfModule mpm_prefork_module>
    StartServers              2
    MinSpareServers           1
    MaxSpareServers           3
    MaxRequestWorkers        ${SITEIMAGEPERSO_MAX_WORKERS}
    MaxConnectionsPerChild  500
</IfModule>

# Frees processes quickly: otherwise a browser keeps several
# idle connections open for 5 seconds each
KeepAliveTimeout 2
