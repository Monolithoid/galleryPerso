<Directory "/var/www/html">
    Options FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php index.html
</Directory>

# Mémoire : chaque processus Apache avec PHP occupe environ 10 à 20 Mo.
# Par défaut Apache peut en lancer 150 ; une dizaine suffit largement
# pour un site familial. Les vidéos et images restent servies sans PHP.
<IfModule mpm_prefork_module>
    StartServers              2
    MinSpareServers           1
    MaxSpareServers           3
    MaxRequestWorkers        ${SITEIMAGEPERSO_MAX_WORKERS}
    MaxConnectionsPerChild  500
</IfModule>
