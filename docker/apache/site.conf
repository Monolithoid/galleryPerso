<Directory "/var/www/html">
    Options FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php index.html
</Directory>

# Lu par .htaccess : pas de redirection HTTPS dans le conteneur, sauf si
# SITEIMAGEPERSO_FORCE_HTTPS=1 (définit alors SITEIMAGEPERSO_FORCE_HTTPS_1)
Define SITEIMAGEPERSO_DOCKER
Define SITEIMAGEPERSO_FORCE_HTTPS_${SITEIMAGEPERSO_FORCE_HTTPS}

# Mémoire : chaque processus Apache avec PHP occupe environ 10 à 20 Mo.
# Par défaut Apache peut en lancer 150 ; une dizaine suffit largement
# pour un site familial. Attention : chaque connexion ouverte, y compris
# une vidéo en cours de lecture, occupe un processus pendant toute sa durée.
<IfModule mpm_prefork_module>
    StartServers              2
    MinSpareServers           1
    MaxSpareServers           3
    MaxRequestWorkers        ${SITEIMAGEPERSO_MAX_WORKERS}
    MaxConnectionsPerChild  500
</IfModule>

# Libère vite les processus : un navigateur garde sinon plusieurs
# connexions inactives ouvertes 5 secondes chacune
KeepAliveTimeout 2
