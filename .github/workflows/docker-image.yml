name: Test and publish Docker image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE || 'monolithoid/galleryperso' }}
  # Docker Hub short description: 100 bytes max (accented characters count double).
  SHORT_DESCRIPTION: "Galerie photo et vidéo familiale old school (PHP, Apache, vips, ffmpeg) sur dossier réseau"

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Docker metadata (tags & OCI labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=galleryPerso
            org.opencontainers.image.description=${{ env.SHORT_DESCRIPTION }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}#readme
            org.opencontainers.image.vendor=monolithoid

      - name: Build candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: galleryperso:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Check documented in the README after every change to the image
      - name: Test media processing inside the image
        run: docker run --rm --entrypoint php galleryperso:ci tests/MediaProcessingTest.php

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compose Docker Hub overview
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RAW_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}
        shell: bash
        run: |
          # Docker Hub cannot resolve the README's relative paths: images point to the
          # raw file of this commit, other links to the file on GitHub.
          python3 - README.md "$RUNNER_TEMP/dockerhub-README.md" <<'PY'
          import os, re, sys
          src, dst = sys.argv[1], sys.argv[2]
          repo, raw, ref = os.environ["REPO_URL"], os.environ["RAW_URL"], os.environ["GITHUB_REF_NAME"]
          text = open(src, encoding="utf-8").read()
          def absolute(path):
              path = path[2:] if path.startswith("./") else path
              if re.search(r"\.(png|jpe?g|gif|svg|webp)$", path.split("#")[0], re.I):
                  return f"{raw}/{path}"
              return f"{repo}/blob/{ref}/{path}"
          relative = r"(?!https?://|mailto:|#|/)([^)\"\s]+)"
          text = re.sub(r"(\]\()" + relative, lambda m: m.group(1) + absolute(m.group(2)), text)
          text = re.sub(r"(src=\")" + relative, lambda m: m.group(1) + absolute(m.group(2)), text)
          text += (
              "\n\n---\n\n## Liens\n\n"
              f"- Code source et documentation : [{os.environ['GITHUB_REPOSITORY']}]({repo})\n"
              f"- Dockerfile : [Dockerfile]({repo}/blob/{ref}/Dockerfile)\n"
              f"- Compose avec oauth2-proxy : [docker-compose.yml]({repo}/blob/{ref}/docker-compose.yml)\n"
              f"- Signaler un problème : [issues GitHub]({repo}/issues)\n"
          )
          open(dst, "w", encoding="utf-8").write(text)
          PY

      - name: Update Docker Hub description
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          short-description: ${{ env.SHORT_DESCRIPTION }}
          readme-filepath: ${{ runner.temp }}/dockerhub-README.md
