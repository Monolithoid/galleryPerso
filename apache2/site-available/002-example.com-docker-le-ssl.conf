# Apache du serveur devant le conteneur Docker (connexion Google comprise).
# Modules nécessaires : a2enmod ssl proxy proxy_http headers
# Le certificat est celui de Let's Encrypt (certbot --apache).
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName example.com

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    # Port SITEIMAGEPERSO_HTTP_PORT du fichier .env
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/
    # Les longues vidéos passent par ce proxy
    ProxyTimeout 600

SSLCertificateFile /etc/letsencrypt/live/example.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/example.com/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf

	# Log parameters
	LogLevel warn
	CustomLog example.com.log combined
	ErrorLog example.com.log
</VirtualHost>
</IfModule>
