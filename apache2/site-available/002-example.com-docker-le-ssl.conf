# The server's Apache in front of the Docker container (Google login included).
# Required modules: a2enmod ssl proxy proxy_http headers
# The certificate is the Let's Encrypt one (certbot --apache).
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName example.com

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    # Asks search engines not to index anything, not even the
    # login page
    Header always set X-Robots-Tag "noindex, nofollow"
    # Port SITEIMAGEPERSO_HTTP_PORT from the .env file
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/
    # Long videos go through this proxy
    ProxyTimeout 600

SSLCertificateFile /etc/letsencrypt/live/example.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/example.com/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf

	# Log parameters
	LogLevel warn
	CustomLog example.com.log combined
	ErrorLog example.com.log
</VirtualHost>
</IfModule>
