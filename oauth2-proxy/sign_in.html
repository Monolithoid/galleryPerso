{{define "sign_in.html"}}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Galerie photos de famille</title>
  <style>
    :root
    {
      --blue: #375D81;
      --blue-dark: #22263C;
      --text: #1f2937;
      --muted: #6b7280;
      --background: #f4f6f9;
    }

    *,
    *::before,
    *::after
    {
      box-sizing: border-box;
    }

    body
    {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
      background: var(--background);
      color: var(--text);
      font-family: "Outfit", system-ui, sans-serif;
      text-align: center;
    }

    h1
    {
      margin: 0 0 0.5rem;
      color: var(--blue);
      font-size: clamp(1.5rem, 6vw, 2.2rem);
      font-weight: 500;
    }

    p
    {
      margin: 0 0 2rem;
      color: var(--muted);
    }

    button
    {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.8rem 1.6rem;
      border: 0;
      border-radius: 10px;
      background: var(--blue);
      color: #fff;
      font: inherit;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    button:hover,
    button:focus-visible
    {
      background: var(--blue-dark);
    }

    button svg
    {
      flex: 0 0 auto;
      padding: 3px;
      border-radius: 50%;
      background: #fff;
    }
  </style>
</head>
<body>
  <h1>Galerie photos de famille</h1>
  <p>Connectez-vous avec votre compte Google pour voir les photos.</p>

  <form method="GET" action="{{.ProxyPrefix}}/start">
    <input type="hidden" name="rd" value="{{.Redirect}}">
    <button type="submit">
      <svg width="24" height="24" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.7 6c4.5-4.2 6.9-10.3 6.9-17.7z"/>
        <path fill="#FBBC05" d="M10.5 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.8-6.1z"/>
        <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.7-6c-2.2 1.5-5 2.3-8.2 2.3-6.2 0-11.5-4.2-13.4-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/>
      </svg>
      Se connecter avec Google
    </button>
  </form>

  <script>
    // Garde le média ouvert (#media=...) après la connexion
    if (window.location.hash) {
      var inputs = document.getElementsByName('rd');
      for (var i = 0; i < inputs.length; i++) {
        var idx = inputs[i].value.indexOf('#');
        if (idx >= 0) {
          inputs[i].value = inputs[i].value.substr(0, idx);
        }
        inputs[i].value += window.location.hash;
      }
    }
  </script>
</body>
</html>
{{end}}
