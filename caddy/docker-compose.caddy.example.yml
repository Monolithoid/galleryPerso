# Seulement si Caddy tourne lui-même dans un conteneur Docker.
# 1. Créer un réseau commun, une seule fois :  docker network create caddy
# 2. Y brancher aussi le conteneur Caddy (dans son propre docker-compose).
# 3. Copier ce fichier à la racine du projet sous le nom
#    docker-compose.override.yml : docker compose le lit automatiquement.
# Caddy joint alors la connexion Google par  reverse_proxy oauth2-proxy:4180
services:
  oauth2-proxy:
    networks:
      - default
      - caddy

networks:
  caddy:
    external: true
